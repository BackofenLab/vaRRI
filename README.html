<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vaRRI README</title>
  <link rel="icon" type="image/png" href="logo/vaRRI.logo.40x40.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  
  <style>
    .anchor-link {
      color: #999;
      text-decoration: none;
      margin-left: 0.3em;
      font-size: 0.8em;
      opacity: 0;
      transition: opacity 0.2s;
    }
    h1:hover .anchor-link,
    h2:hover .anchor-link,
    h3:hover .anchor-link,
    h4:hover .anchor-link,
    h5:hover .anchor-link,
    h6:hover .anchor-link {
      opacity: 1;
    }
    .anchor-link::before {
      content: "🔗";
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    .markdown-body h1, h2, h3, h4, h5, h6 {
        margin-left: -70px;
    }
    .status-banner {
      background-color: #fff8c5;
      border: 1px solid rgba(212, 167, 44, 0.4);
      padding: 8px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 14px;
      color: #24292f;
    }
    @media (max-width: 767px) {
      .markdown-body { padding: 15px; }
    }
  </style>
</head>
<body>

  <article id="content" class="markdown-body">
    <div id="notice"></div>
    <div id="markdown-text">README wird geladen...</div>
  </article>

  <script type="module" src="src/ui/pages/readme.js"></script>
</body>
</html>
